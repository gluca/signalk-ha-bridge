name: SignalK HA Bridge
version: 1.4.0
slug: signalk-ha-bridge
description: Bridge SignalK marine data to Home Assistant with perfect automatic units
url: https://github.com/The-Greg-O/signalk-ha-bridge
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
init: false
startup: application
boot: auto
options:
  signalk_host: "192.168.69.138"
  signalk_port: 3000
  mqtt_broker: "mqtt://192.168.69.138"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  raw_mode: false
schema:
  signalk_host: str
  signalk_port: int
  mqtt_broker: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: password
  raw_mode: bool?
ports: {}
host_network: true
